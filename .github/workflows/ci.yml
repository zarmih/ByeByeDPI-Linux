name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out sources and submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-render-util0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.txt "pytest>=7.0.0"

      - name: Build ciadpi
        run: |
          make -C vendor/byedpi
          test -x vendor/byedpi/ciadpi

      - name: Validate scripts and Python sources
        run: |
          bash -n bootstrap dev-run scripts/*.sh
          python -m compileall -q src tests scripts
          python tests/smoke_test_browser_proxy_helper.py
          PYTHONPATH="$PWD/src" python tests/smoke_test_kde_proxy_adapter.py

      - name: Run test suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Run Qt smoke tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          QT_QPA_PLATFORM: offscreen
        run: |
          python tests/smoke_test_strategies.py
          python tests/smoke_test_library.py
          python tests/smoke_test_gui.py
          python tests/smoke_test_updates.py

      - name: Ensure ciadpi was cleaned up
        run: |
          if pgrep -af '[c]iadpi'; then
            echo "A ciadpi process was left running" >&2
            exit 1
          fi

  kde-kconfig-smoke:
    name: KDE KConfig / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install KDE KConfig CLI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libkf5config-bin
          command -v kreadconfig5
          command -v kwriteconfig5

      - name: Exercise real isolated kioslaverc apply and rollback
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python tests/smoke_test_kde_proxy_real.py

  wayland-smoke:
    name: Wayland / Ubuntu 24.04 / Python 3.12
    runs-on: ubuntu-24.04

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt

      - name: Install Wayland and Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            weston \
            libegl1 \
            libwayland-client0 \
            libwayland-cursor0 \
            libwayland-egl1 \
            libxkbcommon0
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime.txt

      - name: Run real Wayland compositor smoke tests
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          QT_QPA_PLATFORM: wayland
          WAYLAND_DISPLAY: wayland-byebyedpi
          PYTEST_CURRENT_TEST: wayland-smoke
        run: |
          set -euo pipefail
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/wayland-runtime"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/xdg-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/xdg-data"
          mkdir -p "$XDG_RUNTIME_DIR" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
          chmod 700 "$XDG_RUNTIME_DIR"

          weston \
            --backend=headless-backend.so \
            --socket="$WAYLAND_DISPLAY" \
            --idle-time=0 \
            --log="$RUNNER_TEMP/weston.log" &
          WESTON_PID=$!
          trap 'kill "$WESTON_PID" 2>/dev/null || true; wait "$WESTON_PID" 2>/dev/null || true' EXIT

          for _ in {1..50}; do
            if [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
              break
            fi
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" || {
            cat "$RUNNER_TEMP/weston.log"
            exit 1
          }

          timeout 15s python tests/smoke_test_real_display.py
          timeout 15s python tests/smoke_test_updates_real_display.py

  source-release:
    name: Reproducible source archive
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out sources and submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build deterministic source release
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('pyproject.toml').read_text(encoding='utf-8')
          print(re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE).group(1))
          PY
          )"
          EPOCH="$(git log -1 --format=%ct)"
          scripts/build-release.sh \
            --version "$VERSION" \
            --source-date-epoch "$EPOCH" \
            --output-dir dist
          cd dist
          sha256sum -c "ByeByeDPI-Linux-${VERSION}.tar.gz.sha256"

      - name: Upload source release
        uses: actions/upload-artifact@v4
        with:
          name: ByeByeDPI-Linux-source
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
