name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to validate/build
        required: true
        default: v0.3.0
        type: string
      publish:
        description: Publish a GitHub Release after validation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate tag and build release candidate
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged sources and submodule
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate release tag and version
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="$REQUESTED_TAG"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: $TAG" >&2
            exit 1
          }

          test "$(git cat-file -t "refs/tags/$TAG")" = "tag" || {
            echo "Release tags must be annotated tags, not lightweight tags." >&2
            exit 1
          }

          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('pyproject.toml').read_text(encoding='utf-8')
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit('version missing from pyproject.toml')
          print(match.group(1))
          PY
          )"
          RUNTIME_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('src/version.py').read_text(encoding='utf-8')
          match = re.search(r'^__version__\s*=\s*"([^"]+)"', text, re.MULTILINE)
          if not match:
              raise SystemExit('version missing from src/version.py')
          print(match.group(1))
          PY
          )"

          test "$TAG" = "v$VERSION" || {
            echo "Tag $TAG does not match project version $VERSION" >&2
            exit 1
          }
          test "$RUNTIME_VERSION" = "$VERSION" || {
            echo "Runtime version $RUNTIME_VERSION does not match project version $VERSION" >&2
            exit 1
          }

          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          EPOCH="$(git show -s --format=%ct "$TAG_COMMIT")"

          if git cat-file tag "$TAG" | grep -Eq 'BEGIN (PGP|SSH) SIGNATURE'; then
            echo "Tag contains a cryptographic signature block."
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Tag is annotated but is not cryptographically signed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "epoch=$EPOCH" >> "$GITHUB_OUTPUT"
          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Build deterministic source archive
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-release.sh \
            --version "${{ steps.meta.outputs.version }}" \
            --source-date-epoch "${{ steps.meta.outputs.epoch }}" \
            --output-dir dist
          cd dist
          sha256sum -c "ByeByeDPI-Linux-${{ steps.meta.outputs.version }}.tar.gz.sha256"

      - name: Show release candidate metadata
        shell: bash
        run: |
          echo "tag=${{ steps.meta.outputs.tag }}"
          echo "commit=${{ steps.meta.outputs.commit }}"
          echo "signed=${{ steps.meta.outputs.signed }}"
          sha256sum dist/*.tar.gz

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ steps.meta.outputs.tag }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download validated release candidate
        uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          path: dist

      - name: Publish existing tag and assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite assets." >&2
            exit 1
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --fail-on-no-commits
